<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The screen is fixed: it never zooms and never pans away from the app. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>GRND</title>
    <!-- The Telegram SDK: without it `window.Telegram` is absent and the app cannot name its user. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
